# CI/CD deploy to the Hostinger VPS.
#
# Triggers:
#   - automatically on every push to main (after merge)
#   - manually via Actions → "deploy-hostinger" → Run workflow
#
# One-time setup (docs/HOSTINGER_DEPLOYMENT.md §8):
#   1. Complete the initial VPS deploy by hand so the repo exists on the VPS.
#   2. Add repository secrets (Settings → Secrets and variables → Actions):
#        HOSTINGER_SSH_HOST   VPS IP or hostname
#        HOSTINGER_SSH_USER   SSH user (e.g. root)
#        HOSTINGER_SSH_KEY    private key whose public half is in
#                             ~/.ssh/authorized_keys on the VPS
#      Optional repository variable (Settings → ... → Variables):
#        FARRYON_VPS_PATH     repo path on the VPS (default /opt/farryon)
#
# If the secrets are not configured yet, the job skips gracefully instead of
# failing, so CI on main stays green until the VPS is wired up.

name: deploy-hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      VPS_PATH: ${{ vars.FARRYON_VPS_PATH || '/opt/farryon' }}
    steps:
      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "HOSTINGER_SSH_* secrets not set — skipping deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.check.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Run deploy script on the VPS
        if: steps.check.outputs.configured == 'true'
        run: |
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
              "cd '$VPS_PATH' && ./deploy/hostinger/deploy.sh"
