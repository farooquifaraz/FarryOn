# CI/CD deploy to the Hostinger VPS — fully hands-off.
#
# Triggers:
#   - automatically on every push to main (after merge)
#   - manually via Actions → "deploy-hostinger" → Run workflow
#
# How it works: the runner checks out the repo, rsyncs it to the VPS (no git
# credentials ever live on the server), optionally writes the production .env
# from a secret, then runs deploy/hostinger/deploy.sh there. First deploy and
# every update are the same run.
#
# One-time setup (Settings → Secrets and variables → Actions):
#   Secrets (required):
#     HOSTINGER_SSH_HOST   VPS IP or hostname
#     HOSTINGER_SSH_USER   SSH user (e.g. root)
#     HOSTINGER_SSH_KEY    private key whose public half is in
#                          ~/.ssh/authorized_keys on the VPS
#   Secrets (optional):
#     FARRYON_ENV          full contents of the production .env
#                          (deploy/hostinger/env.production.example filled in).
#                          If set, it overwrites the .env on the VPS each run —
#                          making GitHub the single source of truth for config.
#                          If unset, the .env already on the VPS is kept.
#   Variables (optional):
#     FARRYON_VPS_PATH     install path on the VPS (default /opt/farryon)
#
# If the SSH secrets are not configured yet, the job skips gracefully instead
# of failing, so CI on main stays green until the VPS is wired up.

name: deploy-hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      VPS_PATH: ${{ vars.FARRYON_VPS_PATH || '/opt/farryon' }}
    steps:
      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "HOSTINGER_SSH_* secrets not set — skipping deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Configure SSH
        if: steps.check.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync repository to the VPS
        if: steps.check.outputs.configured == 'true'
        run: |
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "mkdir -p '$VPS_PATH'"
          # --delete keeps the server tree identical to the repo; --exclude
          # protects server-side state (.env stays unless FARRYON_ENV is set).
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./ "$SSH_USER@$SSH_HOST:$VPS_PATH/"

      # The emptiness check lives in the shell, not in `if:` — the secrets
      # context is not available in step conditions, and referencing it there
      # makes GitHub reject the whole workflow file (every run fails with no
      # jobs at all, which reads like an infrastructure outage rather than a
      # syntax error).
      - name: Write production .env from secret
        if: steps.check.outputs.configured == 'true'
        env:
          FARRYON_ENV: ${{ secrets.FARRYON_ENV }}
        run: |
          if [ -z "$FARRYON_ENV" ]; then
            echo "FARRYON_ENV secret not set — keeping the .env already on the VPS."
            exit 0
          fi
          # The secret REPLACES the .env on the VPS, so an incomplete one
          # takes production down on the next restart. 2026-09-15: it was
          # updated with two new lines instead of the whole file, deploy #48
          # wrote those two lines over a 43-variable .env, and the live
          # backend survived only because its container never restarted.
          # Refuse anything that is not a whole production .env, and keep a
          # copy of what is being replaced.
          vars=$(printf '%s\n' "$FARRYON_ENV" | grep -cE '^[A-Za-z_][A-Za-z0-9_]*=' || true)
          missing=""
          for k in DOMAIN JWT_SECRET POSTGRES_PASSWORD GEMINI_API_KEY; do
            printf '%s\n' "$FARRYON_ENV" | grep -qE "^$k=." || missing="$missing $k"
          done
          if [ "$vars" -lt 20 ] || [ -n "$missing" ]; then
            echo "::error::FARRYON_ENV is not a whole production .env ($vars variables; missing:${missing:- none}) — refusing to overwrite the .env on the VPS. Paste the FULL file into the secret, or delete the secret to keep the VPS copy."
            exit 1
          fi
          echo "FARRYON_ENV has $vars variables — writing it to the VPS (previous copy kept as .env.bak)."
          printf '%s\n' "$FARRYON_ENV" | ssh -i ~/.ssh/id_deploy \
            "$SSH_USER@$SSH_HOST" "cd '$VPS_PATH' && { [ -f .env ] && cp .env .env.bak || true; } && cat > .env && chmod 600 .env"

      - name: Run deploy script on the VPS
        if: steps.check.outputs.configured == 'true'
        run: |
          # NO_PULL=1: the runner already synced the exact commit being
          # deployed; the server never needs git access.
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
              "cd '$VPS_PATH' && chmod +x deploy/hostinger/deploy.sh && NO_PULL=1 ./deploy/hostinger/deploy.sh"
