name: Build Android APK

# Builds an installable debug APK in the cloud — no local Flutter SDK needed.
# Trigger manually (Actions tab → "Build Android APK" → Run workflow) or it runs
# automatically when anything under mobile/ changes on the dev branch.
# Download the APK from the run's "Artifacts" section and sideload it on a phone
# (enable "Install unknown apps"). Point it at your deployed backend in the app's
# in-app settings sheet (⚙️): host = farryon.izylrn.com, port = 443, secure = ON.
#
# Note: mobile/android is committed and is what we build. It used to be
# scaffolded here with `flutter create`, from a time when the repo did not
# carry one — that stopped being true once the glasses Kotlin channels,
# foreground services, and twenty-one manifest permissions landed in it, and
# the scaffold was deleting all of them on every run. It also regenerated a
# Gradle wrapper pointing at github.com/gradle/gradle-distributions, whose
# 503s failed this workflow on every run from 2026-07-25 onward; the committed
# wrapper pins 8.14 on services.gradle.org.
#
# The vendor glasses .aar is git-ignored, so CI builds without it — the app
# falls back to stub mode, exactly as app/libs/README.md describes.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Flutter version
        run: flutter --version

      # ---- VPS access (vendor SDK in, built APKs out) ------------------------
      # One key, used twice: to fetch the glasses SDK before the build and to
      # publish the APKs after it. Absent secrets are not an error — the build
      # still runs and uploads an artifact, it just cannot do either transfer.
      - name: Check VPS access
        id: vps
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "HOSTINGER_SSH_* not set — no vendor SDK, no publish."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.vps.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # The HeyCyan .aar is vendor-licensed, so it is git-ignored and lives on
      # the VPS instead. It is not optional: HeyCyanGlassesSdk.kt imports
      # com.oudmon.* directly, and without the library the Kotlin compile fails
      # with ~20 "overrides nothing" / "unresolved reference" errors. (The note
      # in app/libs/README.md about building in stub mode without it is wrong;
      # that is corrected there.)
      - name: Fetch the vendor glasses SDK
        if: steps.vps.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SDK_DIR: ${{ vars.FARRYON_SDK_DIR || '/opt/farryon-sdk' }}
        run: |
          set -euo pipefail
          mkdir -p android/app/libs
          if ! scp -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST:$SDK_DIR/*.aar" android/app/libs/; then
            echo "::error::No .aar in $SDK_DIR on the VPS. The glasses SDK is"
            echo "::error::required to compile — upload it there (see"
            echo "::error::mobile/android/app/libs/README.md) and re-run."
            exit 1
          fi
          ls -lh android/app/libs/

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis (non-blocking)
        run: flutter analyze || true

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: List built APK sizes
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK (arm64-v8a release)
        uses: actions/upload-artifact@v4
        with:
          name: farryon-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      # ---- publish to the VPS ------------------------------------------------
      # The website's download buttons serve whatever is in the VPS build
      # directory, so a rebuilt APK has to land there or users keep getting the
      # old one. The backend reads that directory on every request (APK_DIR, a
      # read-only mount) — no redeploy, no image rebuild.
      #
      # The directory sits OUTSIDE /opt/farryon on purpose: the deploy workflow
      # rsyncs with --delete, which would erase any build kept inside it.
      # main only: the website serves whatever lands here, so a branch build
      # must never overwrite what users are downloading. Branch runs still
      # build and upload the artifact, they just do not publish.
      - name: Publish APKs to the VPS
        if: steps.vps.outputs.configured == 'true' && github.ref == 'refs/heads/main'
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          APK_HOST_DIR: ${{ vars.FARRYON_APK_DIR || '/opt/farryon-builds' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "mkdir -p '$APK_HOST_DIR'"

          out=build/app/outputs/flutter-apk
          # source file -> the name backend/app/web/router.py serves
          publish() {
            src="$out/$1"; dest="$2"
            if [ ! -f "$src" ]; then
              echo "::warning::$src not built — skipping $dest"
              return
            fi
            # Upload beside the target, then mv. A rename within one filesystem
            # is atomic, so a request landing mid-upload never gets a truncated
            # APK — it gets the previous build.
            scp -i ~/.ssh/id_deploy "$src" "$SSH_USER@$SSH_HOST:$APK_HOST_DIR/.$dest.part"
            ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
              "mv -f '$APK_HOST_DIR/.$dest.part' '$APK_HOST_DIR/$dest' && chmod 644 '$APK_HOST_DIR/$dest'"
            echo "published $dest"
          }

          publish app-arm64-v8a-release.apk   FarryOn-Aurora-arm64.apk
          publish app-armeabi-v7a-release.apk FarryOn-Aurora-arm32.apk

          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "ls -lh '$APK_HOST_DIR'"
