name: Build Android APK

# Builds an installable debug APK in the cloud — no local Flutter SDK needed.
# Trigger manually (Actions tab → "Build Android APK" → Run workflow) or it runs
# automatically when anything under mobile/ changes on the dev branch.
# Download the APK from the run's "Artifacts" section and sideload it on a phone
# (enable "Install unknown apps"). Point it at your deployed backend in the app's
# in-app settings sheet (⚙️): host = <name>.onrender.com, port = 443, secure = ON.
#
# Note: the app ships its Dart code (lib/), pubspec, and tests, but not the
# generated Android Gradle project. We materialise a version-correct Android
# project (v2 embedding) at build time with `flutter create`, then patch in the
# camera/mic/internet permissions. This keeps the repo free of generated gradle
# while guaranteeing the scaffold matches the pinned Flutter version.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Materialise Android project (v2 embedding)
        run: |
          flutter create \
            --org com.farryon --project-name farryon \
            --platforms=android /tmp/farryon_scaffold
          rm -rf android
          cp -r /tmp/farryon_scaffold/android ./android

      - name: Apply runtime permissions to AndroidManifest
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          xml = p.read_text()
          perms = (
              '    <uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.CAMERA"/>\n'
              '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
          )
          if "android.permission.CAMERA" not in xml:
              xml = re.sub(r"(<manifest[^>]*>\s*\n)", r"\1" + perms, xml, count=1)
              p.write_text(xml)
              print("Permissions injected:\n" + perms)
          else:
              print("Permissions already present.")
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis (non-blocking)
        run: flutter analyze || true

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: List built APK sizes
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK (arm64-v8a release)
        uses: actions/upload-artifact@v4
        with:
          name: farryon-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      # ---- publish to the VPS ------------------------------------------------
      # The website's download buttons serve whatever is in the VPS build
      # directory, so a rebuilt APK has to land there or users keep getting the
      # old one. The backend reads that directory on every request (APK_DIR, a
      # read-only mount) — no redeploy, no image rebuild.
      #
      # The directory sits OUTSIDE /opt/farryon on purpose: the deploy workflow
      # rsyncs with --delete, which would erase any build kept inside it.
      - name: Check publish secrets
        id: check
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "HOSTINGER_SSH_* not set — skipping publish."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish APKs to the VPS
        if: steps.check.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          APK_HOST_DIR: ${{ vars.FARRYON_APK_DIR || '/opt/farryon-builds' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "mkdir -p '$APK_HOST_DIR'"

          out=build/app/outputs/flutter-apk
          # source file -> the name backend/app/web/router.py serves
          publish() {
            src="$out/$1"; dest="$2"
            if [ ! -f "$src" ]; then
              echo "::warning::$src not built — skipping $dest"
              return
            fi
            # Upload beside the target, then mv. A rename within one filesystem
            # is atomic, so a request landing mid-upload never gets a truncated
            # APK — it gets the previous build.
            scp -i ~/.ssh/id_deploy "$src" "$SSH_USER@$SSH_HOST:$APK_HOST_DIR/.$dest.part"
            ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
              "mv -f '$APK_HOST_DIR/.$dest.part' '$APK_HOST_DIR/$dest' && chmod 644 '$APK_HOST_DIR/$dest'"
            echo "published $dest"
          }

          publish app-arm64-v8a-release.apk   FarryOn-Aurora-arm64.apk
          publish app-armeabi-v7a-release.apk FarryOn-Aurora-arm32.apk

          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "ls -lh '$APK_HOST_DIR'"
